<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Free Finder</title>
<style>
  :root {
    --green-900: #0f3d2e; --green-800: #1b4a38; --green-100: #dcefe4; --green-700: #1f6b4c;
    --amber-400: #f2b544; --amber-100: #fdf0da;
    --stone-50: #faf8f5; --stone-100: #f1ede6; --stone-200: #e4ddd2;
    --stone-500: #7a7266; --stone-700: #4a453c; --stone-900: #292520;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; background: var(--stone-50); color: var(--stone-900); }
  header { background: var(--green-900); color: white; padding: 14px 18px; position: sticky; top: 0; z-index: 10; }
  header .row { display: flex; align-items: center; justify-content: space-between; max-width: 1000px; margin: 0 auto; flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { font-size: 12px; color: #a9d6c1; margin-top: 2px; }
  .refresh-btn { background: var(--amber-400); color: var(--green-900); border: none; font-weight: 700; padding: 10px 16px; border-radius: 999px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .refresh-btn:disabled { opacity: 0.6; cursor: default; }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  nav { background: white; border-bottom: 1px solid var(--stone-200); position: sticky; top: 62px; z-index: 9; overflow-x: auto; white-space: nowrap; }
  nav .inner { max-width: 1000px; margin: 0 auto; display: flex; }
  nav button { background: none; border: none; border-bottom: 3px solid transparent; padding: 12px 14px; font-size: 13px; font-weight: 600; color: var(--stone-500); cursor: pointer; }
  nav button.active { color: var(--green-800); border-bottom-color: var(--green-700); }
  main { max-width: 1000px; margin: 0 auto; padding: 18px; }

  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-chip { background: white; border: 1px solid var(--stone-200); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--stone-700); cursor: pointer; }
  .filter-chip.active { background: var(--green-800); color: white; border-color: var(--green-800); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .item-card { background: white; border: 1px solid var(--stone-200); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.03); display: flex; flex-direction: column; }
  .item-media { height: 92px; display: flex; align-items: center; justify-content: center; font-size: 40px; background: var(--green-100); }
  .item-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .item-name { font-size: 14px; font-weight: 700; line-height: 1.3; margin: 0; }
  .item-store { font-size: 12px; color: var(--stone-500); }
  .item-price-row { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
  .item-price { font-weight: 800; font-size: 15px; color: var(--green-800); }
  .item-price.paid { color: var(--stone-900); }
  .cat-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--amber-100); color: #8a5a00; }
  .req-badge { font-size: 11px; font-weight: 600; color: var(--stone-500); }
  .item-meta { font-size: 11px; color: var(--stone-500); display: flex; gap: 10px; flex-wrap: wrap; }
  .item-actions { display: flex; border-top: 1px solid var(--stone-100); }
  .item-actions button { flex: 1; background: none; border: none; padding: 10px 4px; font-size: 11px; font-weight: 700; color: var(--stone-700); cursor: pointer; border-right: 1px solid var(--stone-100); }
  .item-actions button:last-child { border-right: none; }
  .item-actions button.saved { color: #c23a3a; }
  .item-actions button:hover { background: var(--stone-50); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--stone-500); grid-column: 1 / -1; }
  .prefs { max-width: 420px; }
  .prefs label { font-size: 13px; font-weight: 700; display: block; margin: 14px 0 6px; }
  .prefs input { width: 100%; padding: 9px 10px; border: 1px solid var(--stone-200); border-radius: 8px; font-size: 14px; }
  .prefs .hint { font-size: 12px; color: var(--stone-500); margin-top: 6px; line-height: 1.5; }
  .prefs .hint a { color: var(--green-700); }
  .dashboard-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 10px; margin-bottom: 18px; }
  .stat { background: white; border: 1px solid var(--stone-200); border-radius: 14px; padding: 12px; text-align: center; }
  .stat .num { font-size: 22px; font-weight: 800; color: var(--green-800); }
  .stat .lbl { font-size: 11px; color: var(--stone-500); margin-top: 2px; }
  .error-box { background: #fde8e8; color: #8a2020; border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
  .warn-box { background: var(--amber-100); color: #8a5a00; border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--green-900); color: white; padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="row">
    <div>
      <h1>Daily Free Finder</h1>
      <div class="sub" id="lastScanLabel">Not scanned yet</div>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="runFullScan()">
      <span id="refreshIcon">&#8635;</span> <span id="refreshLabel">Refresh</span>
    </button>
  </div>
</header>

<nav><div class="inner" id="navBar"></div></nav>

<main>
  <div id="statusArea"></div>
  <div id="content"></div>
</main>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// CATEGORIES — expanded per the FreeFinder/SaveSmart spec:
// restaurant deals, grocery, clothing, toys, accessories,
// events, community resources, free-by-mail.
// icon = emoji shown on the card in place of a real photo
// (see reply for why real product photos aren't available free)
// ============================================================
// ============================================================
// EMBEDDED API KEY — paste your Tavily key between the quotes below.
// This lets less-technical users skip the Preferences setup step.
// SECURITY NOTE: anyone who opens/views this HTML file's source can
// see this key. Fine for sharing with family/friends you trust; do
// NOT post this file publicly or send it to strangers.
// ============================================================
const EMBEDDED_API_KEY = "PASTE_YOUR_TAVILY_KEY_HERE";

// Kroger Developer API (free, developer.kroger.com) — returns real store
// price/aisle data instead of search-snippet guesses, for Kroger-family
// stores (Kroger, Ralphs, Fry's, Smith's, King Soopers, Fred Meyer, etc).
// Register a free app to get these two values. Uses OAuth client_credentials.
// NOTE: like the Tavily key above, anyone who views this file's source can
// see these — fine for family/friends, don't post the file publicly.
const EMBEDDED_KROGER_CLIENT_ID = "PASTE_YOUR_KROGER_CLIENT_ID_HERE";
const EMBEDDED_KROGER_CLIENT_SECRET = "PASTE_YOUR_KROGER_CLIENT_SECRET_HERE";

// Retailer/official sites only — keeps grocery results to actual
// store pages and flyers instead of blog "roundup" articles.
const GROCERY_DOMAINS = [
  "walmart.com", "kroger.com", "target.com", "aldi.us", "publix.com", "safeway.com",
  "heb.com", "meijer.com", "wegmans.com", "sprouts.com", "harristeeter.com",
  "foodlion.com", "winndixie.com", "giantfood.com", "stopandshop.com", "shoprite.com",
  "instacart.com", "flipp.com", "albertsons.com", "vons.com", "smithsfoodanddrug.com"
];
// Official chain sites only — keeps restaurant results to the chains'
// own promo pages instead of "10 best fast food deals" blog articles.
const RESTAURANT_DOMAINS = [
  "mcdonalds.com", "chick-fil-a.com", "tacobell.com", "chipotle.com", "starbucks.com",
  "dunkindonuts.com", "popeyes.com", "subway.com", "panerabread.com", "sonicdrivein.com",
  "arbys.com", "bk.com", "kfc.com", "pandaexpress.com", "wingstop.com", "culvers.com",
  "dairyqueen.com", "dominos.com", "pizzahut.com", "papajohns.com", "littlecaesars.com",
  "zaxbys.com", "bojangles.com", "ihop.com", "dennys.com", "crackerbarrel.com",
  "applebees.com", "chilis.com", "olivegarden.com", "outback.com", "buffalowildwings.com",
  "fiveguys.com", "in-n-out.com", "whataburger.com", "jackinthebox.com", "deltaco.com",
  "qdoba.com", "jimmyjohns.com", "firehousesubs.com", "jerseymikes.com", "raisingcanes.com"
];

// Target grocery staples only — per spec, nothing else is priced/searched.
const GROCERY_ITEMS = ["Bread", "Eggs", "Chicken", "Ground beef", "Cheese", "Butter", "Milk", "Adobo seasoning"];

// Known big corporate fast-food/restaurant chains. Anything NOT matching one of these
// is treated as an independent/mom-and-pop spot and tagged [LOCAL] per spec.
const KNOWN_CHAINS = [
  "mcdonald", "chick-fil-a", "chickfila", "wendy", "taco bell", "chipotle", "starbucks",
  "dunkin", "popeyes", "subway", "panera", "sonic", "arby", "burger king", "kfc",
  "panda express", "wingstop", "culver", "dairy queen", "domino", "pizza hut",
  "papa john", "little caesars", "zaxby", "bojangles", "ihop", "denny", "cracker barrel",
  "applebee", "chili's", "chilis", "olive garden", "outback", "buffalo wild wings",
  "five guys", "in-n-out", "in n out", "whataburger", "jack in the box", "del taco",
  "qdoba", "jimmy john", "firehouse subs", "jersey mike", "raising cane", "shake shack",
  "carl's jr", "carls jr", "hardee", "krystal", "checkers", "rally's", "rallys",
  "long john silver", "captain d", "boston market", "moe's", "moes southwest",
  "el pollo loco", "church's chicken", "churchs chicken", "wingstreet", "einstein bros",
  "smoothie king", "jamba juice", "auntie anne", "cinnabon", "baskin robbins",
  "cold stone", "sonic drive"
];

const CATEGORIES = {
  dashboard: { label: "Dashboard" },
  restaurant: { label: "Restaurant Deals", icon: "🍔", timeRange: "week", includeDomains: RESTAURANT_DOMAINS, searchDepth: "advanced", query: (loc, r) =>
    `free food OR BOGO "buy one get one free" deal app reward loyalty sign up major fast food chain restaurant near ${loc} within ${r} miles` },
  grocery: { label: "Grocery", icon: "🛒", timeRange: "week", isPriced: true, groceryItems: GROCERY_ITEMS },
  clothing: { label: "Clothing", icon: "👕", timeRange: "month", query: (loc) =>
    `free clothing giveaway OR free t-shirt promotion OR free shoes promotion near ${loc} OR online` },
  toys: { label: "Toys", icon: "🧸", timeRange: "month", query: (loc) =>
    `free toy promotion OR LEGO giveaway OR Hasbro promotion OR toy drive near ${loc}` },
  accessories: { label: "Accessories", icon: "👜", timeRange: "month", query: (loc) =>
    `free backpack OR free water bottle OR free tote bag OR free school supplies giveaway near ${loc}` },
  events: { label: "Events", icon: "🎉", timeRange: "month", query: (loc, r) =>
    `free community events this week near ${loc} within ${r} miles` },
  community: { label: "Community", icon: "📦", timeRange: null, query: (loc) =>
    `food pantry OR church food box OR community fridge OR clothing closet OR soup kitchen near ${loc}` },
  mail: { label: "By Mail", icon: "✉️", timeRange: "month", query: () =>
    `free samples by mail 2026 baby beauty coffee pet seeds` },
  prefs: { label: "Preferences" }
};

const REQ_TYPES = {
  no_purchase: "No Purchase Required",
  signup: "Sign-Up Reward",
  loyalty: "Loyalty Reward",
  rebate: "Rebate / Mail-In",
  giveaway: "Giveaway / Contest",
  bogo: "BOGO Free",
  unknown: "See Details"
};

let state = {
  tab: "dashboard",
  location: localStorage.getItem("dff_location") || "your area",
  radius: localStorage.getItem("dff_radius") || "100",
  apiKey: localStorage.getItem("dff_tavily_key") || EMBEDDED_API_KEY,
  krogerZip: localStorage.getItem("dff_kroger_zip") || "",
  krogerToken: null,
  krogerTokenExpiry: 0,
  krogerLocationId: localStorage.getItem("dff_kroger_location_id") || null,
  krogerLocationZip: localStorage.getItem("dff_kroger_location_zip") || null,
  results: {},
  filters: {}, // per-category active requirement-type filter
  saved: new Set(JSON.parse(localStorage.getItem("dff_saved") || "[]")),
  lastScan: localStorage.getItem("dff_last_scan") || null,
  scanning: false,
  error: null
};
Object.keys(CATEGORIES).forEach(k => { if (k !== "dashboard" && k !== "prefs") state.results[k] = []; });
try {
  const saved = JSON.parse(localStorage.getItem("dff_results") || "null");
  if (saved) state.results = { ...state.results, ...saved };
} catch (e) {}

// ---------- heuristic extraction: turns a raw search result into an item card ----------
function extractPrice(text) {
  const m = (text || "").match(/\$\s?\d+(\.\d{2})?/);
  return m ? m[0].replace(/\s/, "") : null;
}
function looksFree(text) {
  return /\bfree\b/i.test(text || "");
}
function looksBogo(text) {
  return /\bbogo\b|buy\s*one[,]?\s*get\s*one/i.test(text || "");
}
function isKnownChain(text) {
  const t = (text || "").toLowerCase();
  return KNOWN_CHAINS.some(c => t.includes(c));
}
function extractRequirementType(text) {
  const t = (text || "").toLowerCase();
  if (looksBogo(t)) return "bogo";
  if (/no purchase (necessary|required)/.test(t)) return "no_purchase";
  if (/sign[\s-]?up|register|create an account/.test(t)) return "signup";
  if (/loyalty|rewards (app|program|card)/.test(t)) return "loyalty";
  if (/rebate|mail-in|mail in offer/.test(t)) return "rebate";
  if (/giveaway|contest|sweepstakes|enter to win/.test(t)) return "giveaway";
  return "unknown";
}
function extractExpiry(text) {
  const m = (text || "").match(/\b(expires?|through|until|ends?)\b[^.]{0,25}/i);
  return m ? m[0].replace(/^\w+/, w => w[0].toUpperCase() + w.slice(1)) : null;
}
function hostname(url) {
  try { return new URL(url).hostname.replace("www.", ""); } catch (e) { return "Web"; }
}
function toItem(raw, catKey) {
  const price = extractPrice(raw.content);
  const isFree = !price && looksFree(raw.content);
  const isBogo = looksBogo(raw.content) || looksBogo(raw.title);

  if (catKey === "restaurant") {
    // Pricing cap: must be 100% free or BOGO free. Anything with a real
    // price attached that isn't flagged BOGO falls outside the spec — drop it.
    if (price && !isBogo) return null;
    const combined = (raw.title || "") + " " + (raw.content || "");
    const isLocal = !isKnownChain(combined);
    return {
      id: raw.url,
      title: (isLocal ? "[LOCAL] " : "") + (raw.title || "Untitled offer"),
      store: hostname(raw.url),
      url: raw.url,
      price: isBogo ? "BOGO Free" : price,
      isFree: isFree || isBogo,
      isLocal: isLocal,
      requirementType: extractRequirementType(raw.content),
      expires: extractExpiry(raw.content),
      category: catKey
    };
  }

  return {
    id: raw.url,
    title: raw.title || "Untitled offer",
    store: hostname(raw.url),
    url: raw.url,
    price: price,
    isFree: isFree,
    requirementType: extractRequirementType(raw.content),
    expires: extractExpiry(raw.content),
    category: catKey
  };
}

// ---------- rendering ----------
function buildNav() {
  const nav = document.getElementById("navBar");
  nav.innerHTML = "";
  Object.keys(CATEGORIES).forEach(key => {
    const btn = document.createElement("button");
    btn.textContent = (CATEGORIES[key].icon ? CATEGORIES[key].icon + " " : "") + CATEGORIES[key].label;
    btn.className = state.tab === key ? "active" : "";
    btn.onclick = () => { state.tab = key; render(); };
    nav.appendChild(btn);
  });
}

function priceLabel(item, cat) {
  if (item.isFree) return "FREE";
  if (item.price) return item.price;
  return cat.isPriced ? "See price" : "FREE / Varies";
}

function itemCard(item) {
  const cat = CATEGORIES[item.category];
  return `<div class="item-card">
    <div class="item-media">${cat.icon || "🎁"}</div>
    <div class="item-body">
      <p class="item-name">${item.title}</p>
      <div class="item-store">${item.store}</div>
      <div class="item-price-row">
        <span class="item-price ${item.isFree ? "" : "paid"}">${priceLabel(item, cat)}</span>
        <span class="cat-badge">${cat.label}</span>
      </div>
      <div class="item-meta">
        <span>${REQ_TYPES[item.requirementType]}</span>
        ${item.expires ? `<span>${item.expires}</span>` : ""}
      </div>
    </div>
    <div class="item-actions">
      <button onclick="toggleSave('${item.id.replace(/'/g, "\\'")}')" class="${state.saved.has(item.id) ? "saved" : ""}">${state.saved.has(item.id) ? "♥ Saved" : "♡ Save"}</button>
      <button onclick="openDirections('${(item.store + " " + state.location).replace(/'/g, "\\'")}')">📍 Directions</button>
      <button onclick="window.open('${item.url}', '_blank', 'noopener')">🔗 Claim</button>
      <button onclick="shareItem('${item.title.replace(/'/g, "\\'")}', '${item.url}')">📤 Share</button>
    </div>
  </div>`;
}

function renderList(key) {
  const cat = CATEGORIES[key];
  const items = state.results[key] || [];
  const activeFilter = state.filters[key] || "all";
  const filtered = activeFilter === "all" ? items : items.filter(i => i.requirementType === activeFilter);

  const filterBar = `<div class="filter-bar">
    ${["all", "no_purchase", "signup", "loyalty", "rebate", "giveaway"].map(f => `
      <button class="filter-chip ${activeFilter === f ? "active" : ""}" onclick="setFilter('${key}','${f}')">
        ${f === "all" ? "All" : REQ_TYPES[f]}
      </button>`).join("")}
  </div>`;

  const failed = state.error && state.error.includes(cat.label);
  let body;
  if (filtered.length === 0) {
    if (failed) body = `<div class="empty-state">This category's search failed on the last refresh — see the error above. Try Refresh again.</div>`;
    else if (!state.lastScan) body = `<div class="empty-state">Click <b>Refresh</b> above to run today's search.</div>`;
    else body = `<div class="empty-state">No results match this filter.</div>`;
  } else {
    body = filtered.map(itemCard).join("");
  }
  return filterBar + `<div class="grid">${body}</div>`;
}

function renderDashboard() {
  const counts = Object.keys(CATEGORIES).filter(k => k !== "dashboard" && k !== "prefs")
    .map(k => ({ label: CATEGORIES[k].icon + " " + CATEGORIES[k].label, count: (state.results[k] || []).length }));
  return `<div class="dashboard-stats">${counts.map(c => `<div class="stat"><div class="num">${c.count}</div><div class="lbl">${c.label}</div></div>`).join("")}
    <div class="stat"><div class="num">${state.saved.size}</div><div class="lbl">❤️ Saved</div></div>
  </div>
  ${state.lastScan ? "" : `<div class="empty-state">Click <b>Refresh</b> above to run today's live search for your area.</div>`}`;
}

function renderPrefs() {
  return `<div class="item-card prefs" style="padding:16px">
    <label>Tavily API key</label>
    <input id="keyInput" type="password" value="${state.apiKey}" onchange="state.apiKey=this.value; localStorage.setItem('dff_tavily_key', this.value)" placeholder="tvly-..." />
    <div class="hint">Get a free key (1,000 searches/month, no card) at <a href="https://app.tavily.com" target="_blank" rel="noopener">app.tavily.com</a>. Saved only in this browser — or pre-fill it for everyone by editing EMBEDDED_API_KEY near the top of this file's code.</div>
    <label>Location (city, ZIP, or address)</label>
    <input id="locInput" value="${state.location}" onchange="state.location=this.value; localStorage.setItem('dff_location', this.value)" />
    <label>Search radius (miles, max 100)</label>
    <input id="radiusInput" type="number" max="100" min="1" value="${state.radius}" onchange="const v=Math.min(100, Math.max(1, parseInt(this.value)||100)); this.value=v; state.radius=String(v); localStorage.setItem('dff_radius', String(v))" />
    <label>ZIP code (for Kroger real-time pricing)</label>
    <input id="krogerZipInput" value="${state.krogerZip}" placeholder="e.g. 37083" onchange="state.krogerZip=this.value.trim(); localStorage.setItem('dff_kroger_zip', state.krogerZip)" />
    <div class="hint">Optional. If set (and a Kroger-family store is within your radius), grocery prices come straight from Kroger's live pricing API instead of web search. Falls back automatically to search-based pricing if no Kroger store is nearby or the lookup fails.</div>
  </div>`;
}

function render() {
  buildNav();
  document.getElementById("lastScanLabel").textContent = state.lastScan ? `Last Updated: ${state.lastScan}` : "Not scanned yet";
  const content = document.getElementById("content");
  if (state.tab === "dashboard") content.innerHTML = renderDashboard();
  else if (state.tab === "prefs") content.innerHTML = renderPrefs();
  else content.innerHTML = renderList(state.tab);

  let statusHtml = "";
  if (!state.apiKey || state.apiKey === "PASTE_YOUR_TAVILY_KEY_HERE") statusHtml += `<div class="warn-box">Add your free Tavily API key in the Preferences tab before refreshing.</div>`;
  if (state.error) statusHtml += `<div class="error-box">${state.error}</div>`;
  document.getElementById("statusArea").innerHTML = statusHtml;
}

// ---------- interactions ----------
function setFilter(key, filter) { state.filters[key] = filter; render(); }

function toggleSave(id) {
  if (state.saved.has(id)) state.saved.delete(id); else state.saved.add(id);
  localStorage.setItem("dff_saved", JSON.stringify([...state.saved]));
  render();
}
function openDirections(query) {
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, "_blank", "noopener");
}
function shareItem(title, url) {
  if (navigator.share) {
    navigator.share({ title, url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => showToast("Link copied"));
  }
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

// ---------- scanning ----------
async function searchCategory(key) {
  const cat = CATEGORIES[key];
  const query = cat.query(state.location, state.radius);
  const body = { api_key: state.apiKey, query, max_results: 8, search_depth: cat.searchDepth || "basic" };
  if (cat.timeRange) body.time_range = cat.timeRange;
  if (cat.includeDomains) body.include_domains = cat.includeDomains;

  const response = await fetch("https://api.tavily.com/search", {
    method: "POST",
    cache: "no-store",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!response.ok) {
    const errBody = await response.text();
    throw new Error(`${cat.label} search failed (${response.status}). ${errBody.slice(0, 150)}`);
  }
  const data = await response.json();
  return (data.results || []).map(r => toItem(r, key));
}

// ---------- Kroger API (free, real store pricing) ----------
function krogerConfigured() {
  return EMBEDDED_KROGER_CLIENT_ID && EMBEDDED_KROGER_CLIENT_ID !== "PASTE_YOUR_KROGER_CLIENT_ID_HERE" &&
         EMBEDDED_KROGER_CLIENT_SECRET && EMBEDDED_KROGER_CLIENT_SECRET !== "PASTE_YOUR_KROGER_CLIENT_SECRET_HERE" &&
         state.krogerZip;
}

async function getKrogerToken() {
  if (state.krogerToken && Date.now() < state.krogerTokenExpiry) return state.krogerToken;
  const creds = btoa(`${EMBEDDED_KROGER_CLIENT_ID}:${EMBEDDED_KROGER_CLIENT_SECRET}`);
  const response = await fetch("https://api.kroger.com/v1/connect/oauth2/token", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded",
      "Authorization": `Basic ${creds}`
    },
    body: "grant_type=client_credentials&scope=product.compact"
  });
  if (!response.ok) throw new Error(`Kroger auth failed (${response.status}). Check your Client ID/Secret.`);
  const data = await response.json();
  state.krogerToken = data.access_token;
  state.krogerTokenExpiry = Date.now() + (data.expires_in - 60) * 1000; // refresh 1 min early
  return state.krogerToken;
}

async function getKrogerLocationId() {
  if (state.krogerLocationId && state.krogerLocationZip === state.krogerZip) return state.krogerLocationId;
  const token = await getKrogerToken();
  const url = `https://api.kroger.com/v1/locations?filter.zipCode.near=${encodeURIComponent(state.krogerZip)}&filter.radiusInMiles=${Math.min(100, parseInt(state.radius) || 100)}&filter.limit=1`;
  const response = await fetch(url, { headers: { "Authorization": `Bearer ${token}` } });
  if (!response.ok) throw new Error(`Kroger store lookup failed (${response.status}).`);
  const data = await response.json();
  const loc = (data.data || [])[0];
  if (!loc) throw new Error("No Kroger-family store found near that ZIP within radius.");
  state.krogerLocationId = loc.locationId;
  state.krogerLocationZip = state.krogerZip;
  localStorage.setItem("dff_kroger_location_id", state.krogerLocationId);
  localStorage.setItem("dff_kroger_location_zip", state.krogerZip);
  return state.krogerLocationId;
}

async function searchKrogerItem(itemName) {
  const token = await getKrogerToken();
  const locationId = await getKrogerLocationId();
  const url = `https://api.kroger.com/v1/products?filter.term=${encodeURIComponent(itemName)}&filter.locationId=${locationId}&filter.limit=5`;
  const response = await fetch(url, { headers: { "Authorization": `Bearer ${token}` } });
  if (!response.ok) throw new Error(`Kroger product search failed (${response.status}) for ${itemName}.`);
  const data = await response.json();
  const priced = (data.data || [])
    .map(p => {
      const priceInfo = p.items && p.items[0] && p.items[0].price;
      if (!priceInfo) return null;
      const price = (priceInfo.promo && priceInfo.promo > 0) ? priceInfo.promo : priceInfo.regular;
      return price ? { product: p, price } : null;
    })
    .filter(Boolean)
    .sort((a, b) => a.price - b.price);

  const best = priced[0];
  if (!best) return null; // let caller fall back to search-based pricing
  return {
    id: "grocery-kroger-" + itemName.replace(/\s+/g, "-").toLowerCase(),
    title: itemName,
    store: "Kroger (official price)",
    url: "https://www.kroger.com/search?query=" + encodeURIComponent(itemName),
    price: `$${best.price.toFixed(2)}`,
    isFree: false,
    requirementType: "unknown",
    expires: null,
    category: "grocery"
  };
}


// the single cheapest priced result (store + price) for each item — per spec,
// only these 8 items are ever searched or priced.
async function searchGroceryItem(itemName) {
  if (krogerConfigured()) {
    try {
      const krogerResult = await searchKrogerItem(itemName);
      if (krogerResult) return krogerResult;
    } catch (err) {
      state.error = (state.error ? state.error + " " : "") + `Kroger (${itemName}): ${err.message} — used search fallback.`;
    }
  }
  return searchGroceryItemViaSearch(itemName);
}

async function searchGroceryItemViaSearch(itemName) {
  const query = `cheapest price ${itemName} grocery store sale this week near ${state.location} within ${state.radius} miles`;
  const body = { api_key: state.apiKey, query, max_results: 8, search_depth: "advanced", time_range: "week", include_domains: GROCERY_DOMAINS };
  const response = await fetch("https://api.tavily.com/search", {
    method: "POST",
    cache: "no-store",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!response.ok) {
    const errBody = await response.text();
    throw new Error(`Grocery: ${itemName} search failed (${response.status}). ${errBody.slice(0, 150)}`);
  }
  const data = await response.json();
  const priced = (data.results || [])
    .map(r => ({ raw: r, price: extractPrice(r.content) }))
    .filter(x => x.price)
    .map(x => ({ ...x, num: parseFloat(x.price.replace("$", "")) }))
    .sort((a, b) => a.num - b.num);

  const best = priced[0];
  return {
    id: "grocery-" + itemName.replace(/\s+/g, "-").toLowerCase(),
    title: itemName,
    store: best ? hostname(best.raw.url) : "No price found nearby",
    url: best ? best.raw.url : "#",
    price: best ? best.price : null,
    isFree: false,
    requirementType: "unknown",
    expires: null,
    category: "grocery"
  };
}
async function searchGroceryCategory() {
  const items = [];
  for (const itemName of GROCERY_ITEMS) {
    try {
      items.push(await searchGroceryItem(itemName));
    } catch (err) {
      state.error = (state.error ? state.error + " " : "") + err.message;
    }
  }
  return items;
}

async function runFullScan() {
  if (state.scanning) return;
  if (!state.apiKey || state.apiKey === "PASTE_YOUR_TAVILY_KEY_HERE") { state.tab = "prefs"; render(); return; }

  state.scanning = true;
  state.error = null;
  const btn = document.getElementById("refreshBtn");
  const icon = document.getElementById("refreshIcon");
  const label = document.getElementById("refreshLabel");
  btn.disabled = true;
  icon.classList.add("spin");

  const categoryKeys = Object.keys(CATEGORIES).filter(k => k !== "dashboard" && k !== "prefs");
  for (let i = 0; i < categoryKeys.length; i++) {
    const key = categoryKeys[i];
    label.textContent = `Scanning ${CATEGORIES[key].label} (${i + 1}/${categoryKeys.length})`;
    state.results[key] = []; // clear before this category's fetch so failures never show stale data
    try {
      state.results[key] = key === "grocery" ? await searchGroceryCategory() : await searchCategory(key);
    } catch (err) {
      state.error = (state.error ? state.error + " " : "") + err.message;
    }
    render();
  }

  state.lastScan = new Date().toLocaleString([], { hour: "2-digit", minute: "2-digit", month: "short", day: "numeric" });
  localStorage.setItem("dff_last_scan", state.lastScan);
  localStorage.setItem("dff_results", JSON.stringify(state.results));

  state.scanning = false;
  btn.disabled = false;
  icon.classList.remove("spin");
  label.textContent = "Refresh";
  render();
}

render();
</script>
