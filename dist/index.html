<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BrokeGirlSideQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* ---- pastel 8-bit palette ---- */
    --ink: #2b1d3f;            /* near-black plum, all borders/text */
    --bg: #fdf1ff;             /* pastel lilac page background */
    --panel: #fffdf9;          /* card white-cream */
    --pink: #ff8fc7;
    --pink-soft: #ffe1f2;
    --lav: #a68bff;
    --lav-soft: #ece3ff;
    --mint: #6ee7b7;
    --mint-soft: #d7fbec;
    --sky: #7cc4ff;
    --sky-soft: #dcefff;
    --sun: #ffd23f;
    --sun-soft: #fff2cc;
    --coral: #ff6b6b;
    --coral-soft: #ffe1e1;
  }
  * { box-sizing: border-box; }
  html { image-rendering: pixelated; }
  body {
    margin: 0; font-family: 'Baloo 2', system-ui, sans-serif; color: var(--ink); font-size: 16px; line-height: 1.5;
    background: var(--bg);
    background-image:
      radial-gradient(var(--lav-soft) 2px, transparent 2px),
      radial-gradient(var(--pink-soft) 2px, transparent 2px);
    background-size: 28px 28px;
    background-position: 0 0, 14px 14px;
  }
  .pixel-font { font-family: 'Press Start 2P', monospace; }

  /* notched "8-bit window" corner cut, reused on header/nav/cards/buttons */
  .notch {
    clip-path: polygon(
      0 8px, 8px 8px, 8px 0,
      calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
      100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
      8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
    );
  }

  header {
    background: var(--lav); color: var(--ink); padding: 14px 18px 18px;
    position: sticky; top: 0; z-index: 10;
    border-bottom: 4px solid var(--ink);
  }
  header .row { display: flex; align-items: center; justify-content: space-between; max-width: 1000px; margin: 0 auto; flex-wrap: wrap; gap: 10px; }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .coin {
    width: 52px; height: 58px; background: var(--sun-soft); border: 3px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 3px 3px 0 var(--ink); flex: none; padding: 4px;
  }
  header .coin svg { width: 100%; height: 100%; }
  .mascot-empty { width: 90px; height: 100px; margin: 0 auto 10px; }
  header h1 { font-family: 'Press Start 2P', monospace; font-size: 13px; margin: 0; line-height: 1.6; letter-spacing: 0.5px; text-shadow: 2px 2px 0 var(--panel); }
  header .sub { font-size: 13px; color: #1f1030; margin-top: 4px; font-weight: 800; }
  .refresh-btn {
    background: var(--sun); color: var(--ink); border: 3px solid var(--ink); font-weight: 800;
    padding: 11px 18px; cursor: pointer; font-size: 15px; display: flex; align-items: center; gap: 8px;
    box-shadow: 4px 4px 0 var(--ink); transition: transform .08s, box-shadow .08s;
  }
  .refresh-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .refresh-btn:disabled { opacity: 0.7; cursor: default; }
  .spin { display: inline-block; animation: spin .8s steps(8) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  nav { background: var(--panel); border-bottom: 4px solid var(--ink); position: sticky; top: 74px; z-index: 9; overflow-x: auto; white-space: nowrap; }
  nav .inner { max-width: 1000px; margin: 0 auto; display: flex; }
  nav button {
    background: none; border: none; border-right: 2px dashed var(--lav-soft);
    padding: 13px 16px; font-size: 14px; font-weight: 800; color: #4a3d68; cursor: pointer;
    font-family: 'Baloo 2', sans-serif;
  }
  nav button.active { color: var(--ink); background: var(--sun-soft); box-shadow: inset 0 -4px 0 var(--pink); }
  main { max-width: 1000px; margin: 0 auto; padding: 18px; }

  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-chip {
    background: var(--panel); border: 2px solid var(--ink); border-radius: 20px; padding: 6px 12px;
    font-size: 13px; font-weight: 800; color: var(--ink); cursor: pointer; box-shadow: 2px 2px 0 var(--ink);
  }
  .filter-chip.active { background: var(--mint); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .item-card {
    background: var(--panel); border: 3px solid var(--ink); overflow: hidden;
    box-shadow: 5px 5px 0 var(--lav); display: flex; flex-direction: column;
    transition: transform .1s, box-shadow .1s;
  }
  .item-card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--lav); }
  .item-media { height: 88px; display: flex; align-items: center; justify-content: center; font-size: 38px; background: var(--sky-soft); border-bottom: 3px solid var(--ink); }
  .item-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .item-name { font-size: 16px; font-weight: 800; line-height: 1.4; margin: 0; }
  .item-store { font-size: 13px; color: #4a3d68; font-weight: 700; }
  .item-price-row { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; gap: 6px; }
  .item-price { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 17px; color: #0d5c3c; background: var(--mint-soft); padding: 3px 9px; border: 2px solid var(--ink); letter-spacing: -0.5px; }
  .item-price.paid { color: var(--ink); background: var(--pink-soft); }
  .cat-badge { font-size: 11px; font-weight: 800; padding: 3px 8px; border: 2px solid var(--ink); background: var(--sun-soft); color: #5c4400; white-space: nowrap; }
  .req-badge { font-size: 13px; font-weight: 700; color: #4a3d68; }
  .item-meta { font-size: 12px; color: #4a3d68; display: flex; gap: 10px; flex-wrap: wrap; font-weight: 700; }
  .item-meta a { color: var(--lav); font-weight: 800; text-decoration: underline; }
  .item-actions { display: flex; border-top: 3px solid var(--ink); }
  .item-actions button {
    flex: 1; background: var(--lav-soft); border: none; padding: 11px 4px; font-size: 12px; font-weight: 800;
    color: var(--ink); cursor: pointer; border-right: 2px solid var(--ink); font-family: 'Baloo 2', sans-serif;
  }
  .item-actions button:last-child { border-right: none; }
  .item-actions button.saved { color: var(--coral); background: var(--coral-soft); }
  .item-actions button:hover { background: var(--sun-soft); }

  .empty-state { text-align: center; padding: 40px 20px; color: #4a3d68; grid-column: 1 / -1; font-weight: 700; font-size: 15px; }
  .empty-state b { color: var(--ink); }
  .search-bar {
    display: flex; gap: 12px; flex-wrap: wrap; background: var(--panel); border: 3px solid var(--ink);
    padding: 14px; margin-bottom: 16px; box-shadow: 4px 4px 0 var(--pink);
  }
  .search-field { flex: 1; min-width: 130px; }
  .search-field label { font-size: 12px; font-weight: 800; display: block; margin-bottom: 6px; }
  .search-field input { width: 100%; padding: 10px; border: 3px solid var(--ink); font-size: 14px; font-family: 'Baloo 2', sans-serif; background: var(--bg); }
  .dashboard-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--panel); border: 3px solid var(--ink); padding: 14px; text-align: center; box-shadow: 4px 4px 0 var(--pink); }
  .stat .num { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 30px; color: var(--ink); letter-spacing: -1px; }
  .stat .lbl { font-size: 12px; color: #4a3d68; margin-top: 6px; font-weight: 800; }
  .error-box { background: var(--coral-soft); color: #7a1414; border: 3px solid var(--coral); padding: 12px 14px; font-size: 14px; margin-bottom: 14px; font-weight: 700; }
  .warn-box { background: var(--sun-soft); color: #5c4400; border: 3px solid var(--sun); padding: 12px 14px; font-size: 14px; margin-bottom: 14px; font-weight: 700; }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--sun);
    padding: 12px 20px; font-size: 14px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none;
    font-family: 'Baloo 2', sans-serif; font-weight: 800; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--lav);
  }
  .toast.show { opacity: 1; }

  .pixel-footer { border-top: 4px solid var(--ink); line-height: 0; margin-top: 24px; }
  .pixel-footer svg { display: block; width: 100%; height: 150px; }
  .pixel-footer-caption {
    text-align: center; font-family: 'Press Start 2P', monospace; font-size: 10px;
    color: var(--ink); background: var(--sun-soft); padding: 10px; border-top: 4px solid var(--ink);
  }
</style>
</head>

  grocery: { label: "Grocery", icon: "🛒", timeRange: "week", isPriced: true, groceryItems: GROCERY_ITEMS },
  clothing: { label: "Clothing", icon: "👕", timeRange: "month", query: (loc) =>
    `free clothing giveaway OR free t-shirt promotion OR free shoes promotion near ${loc} OR online` },
  toys: { label: "Toys", icon: "🧸", timeRange: "month", query: (loc) =>
    `free toy promotion OR LEGO giveaway OR Hasbro promotion OR toy drive near ${loc}` },
  accessories: { label: "Accessories", icon: "👜", timeRange: "month", query: (loc) =>
    `free backpack OR free water bottle OR free tote bag OR free school supplies giveaway near ${loc}` },
  events: { label: "Events", icon: "🎉", timeRange: "month", query: (loc, r) =>
    `free community events this week near ${loc} within ${r} miles` },
  community: { label: "Community", icon: "📦", timeRange: null, query: (loc) =>
    `food pantry OR church food box OR community fridge OR clothing closet OR soup kitchen near ${loc}` },
  mail: { label: "By Mail", icon: "✉️", timeRange: "month", query: () =>
    `free samples by mail 2026 baby beauty coffee pet seeds` }
};

const REQ_TYPES = {
  no_purchase: "No Purchase Required",
  signup: "Sign-Up Reward",
  loyalty: "Loyalty Reward",
  rebate: "Rebate / Mail-In",
  giveaway: "Giveaway / Contest",
  bogo: "BOGO Free",
  unknown: "See Details"
};

let state = {
  tab: "dashboard",
  // One ZIP now drives both the Kroger official-price lookup and the
  // general "near me" web search — falls back to whatever was saved under
  // the old two-box setup so existing users don't lose their saved value.
  zip: localStorage.getItem("dff_zip") || localStorage.getItem("dff_kroger_zip") || "",
  radius: localStorage.getItem("dff_radius") || "100",
  results: {},
  filters: {}, // per-category active requirement-type filter
  saved: new Set(JSON.parse(localStorage.getItem("dff_saved") || "[]")),
  lastScan: localStorage.getItem("dff_last_scan") || null,
  scanning: false,
  error: null
};
document.getElementById("zipInput").value = state.zip;
document.getElementById("radiusInput").value = state.radius;
Object.keys(CATEGORIES).forEach(k => { if (k !== "dashboard") state.results[k] = []; });
try {
  const saved = JSON.parse(localStorage.getItem("dff_results") || "null");
  if (saved) state.results = { ...state.results, ...saved };
} catch (e) {}

// ---------- heuristic extraction: turns a raw search result into an item card ----------
function extractPrice(text) {
  const m = (text || "").match(/\$\s?\d+(\.\d{2})?/);
  return m ? m[0].replace(/\s/, "") : null;
}
function looksFree(text) {
  return /\bfree\b/i.test(text || "");
}
function looksBogo(text) {
  return /\bbogo\b|buy\s*one[,]?\s*get\s*one/i.test(text || "");
}
function isKnownChain(text) {
  const t = (text || "").toLowerCase();
  return KNOWN_CHAINS.some(c => t.includes(c));
}
function extractRequirementType(text) {
  const t = (text || "").toLowerCase();
  if (looksBogo(t)) return "bogo";
  if (/no purchase (necessary|required)/.test(t)) return "no_purchase";
  if (/sign[\s-]?up|register|create an account/.test(t)) return "signup";
  if (/loyalty|rewards (app|program|card)/.test(t)) return "loyalty";
  if (/rebate|mail-in|mail in offer/.test(t)) return "rebate";
  if (/giveaway|contest|sweepstakes|enter to win/.test(t)) return "giveaway";
  return "unknown";
}
function extractExpiry(text) {
  const m = (text || "").match(/\b(expires?|through|until|ends?)\b[^.]{0,25}/i);
  return m ? m[0].replace(/^\w+/, w => w[0].toUpperCase() + w.slice(1)) : null;
}
function hostname(url) {
  try { return new URL(url).hostname.replace("www.", ""); } catch (e) { return "Web"; }
}
function toItem(raw, catKey) {
  const price = extractPrice(raw.content);
  const isFree = !price && looksFree(raw.content);
  const isBogo = looksBogo(raw.content) || looksBogo(raw.title);

  if (catKey === "restaurant") {
    // Pricing cap: must be 100% free or BOGO free. Anything with a real
    // price attached that isn't flagged BOGO falls outside the spec — drop it.
    if (price && !isBogo) return null;
    const combined = (raw.title || "") + " " + (raw.content || "");
    const isLocal = !isKnownChain(combined);
    return {
      id: raw.url,
      title: (isLocal ? "[LOCAL] " : "") + (raw.title || "Untitled offer"),
      store: hostname(raw.url),
      url: raw.url,
      price: isBogo ? "BOGO Free" : price,
      isFree: isFree || isBogo,
      isLocal: isLocal,
      requirementType: extractRequirementType(raw.content),
      expires: extractExpiry(raw.content),
      category: catKey
    };
  }

  return {
    id: raw.url,
    title: raw.title || "Untitled offer",
    store: hostname(raw.url),
    url: raw.url,
    price: price,
    isFree: isFree,
    requirementType: extractRequirementType(raw.content),
    expires: extractExpiry(raw.content),
    category: catKey
  };
}

// ---------- rendering ----------
function buildNav() {
  const nav = document.getElementById("navBar");
  nav.innerHTML = "";
  Object.keys(CATEGORIES).forEach(key => {
    const btn = document.createElement("button");
    btn.textContent = (CATEGORIES[key].icon ? CATEGORIES[key].icon + " " : "") + CATEGORIES[key].label;
    btn.className = state.tab === key ? "active" : "";
    btn.onclick = () => { state.tab = key; render(); };
    nav.appendChild(btn);
  });
}

function priceLabel(item, cat) {
  if (item.price) return item.price;
  if (item.isFree) return "FREE";
  return cat.isPriced ? "See price" : "FREE / Varies";
}

function itemCard(item) {
  const cat = CATEGORIES[item.category];
  const isGrocery = item.category === "grocery";

  // Grocery: "Claim" always points at the actual grocer's page for the
  // winning price — productUrl when we resolved one, otherwise falling
  // back to the blog page so Claim is never a dead end. When the price
  // came from a third-party page, the "See Details" line in the meta row
  // gets the blog link appended right after it (one line, not a duplicate
  // second line).
  const claimUrl = isGrocery ? (item.productUrl || item.url) : item.url;
  const detailLinkInline = (isGrocery && item.blogUrl)
    ? `: <a href="${item.blogUrl}" target="_blank" rel="noopener">${hostname(item.blogUrl)}</a>`
    : "";

  return `<div class="item-card">
    <div class="item-media">${cat.icon || "🎁"}</div>
    <div class="item-body">
      <p class="item-name">${item.title}</p>
      <div class="item-store">${item.store}</div>
      <div class="item-price-row">
        <span class="item-price ${item.isFree ? "" : "paid"}">${priceLabel(item, cat)}</span>
        <span class="cat-badge">${cat.label}</span>
      </div>
      <div class="item-meta">
        <span>${REQ_TYPES[item.requirementType]}${detailLinkInline}</span>
        ${item.expires ? `<span>${item.expires}</span>` : ""}
      </div>
    </div>
    <div class="item-actions">
      <button onclick="toggleSave('${item.id.replace(/'/g, "\\'")}')" class="${state.saved.has(item.id) ? "saved" : ""}">${state.saved.has(item.id) ? "♥ Saved" : "♡ Save"}</button>
      <button onclick="openDirections('${(item.store + " " + state.zip).replace(/'/g, "\\'")}')">📍 Directions</button>
      <button onclick="window.open('${claimUrl}', '_blank', 'noopener')">🔗 Claim</button>
      <button onclick="shareItem('${item.title.replace(/'/g, "\\'")}', '${claimUrl}')">📤 Share</button>
    </div>
  </div>`;
}

function renderList(key) {
  const cat = CATEGORIES[key];
  const items = state.results[key] || [];
  const activeFilter = state.filters[key] || "all";
  const filtered = activeFilter === "all" ? items : items.filter(i => i.requirementType === activeFilter);

  const filterBar = `<div class="filter-bar">
    ${["all", "no_purchase", "signup", "loyalty", "rebate", "giveaway"].map(f => `
      <button class="filter-chip ${activeFilter === f ? "active" : ""}" onclick="setFilter('${key}','${f}')">
        ${f === "all" ? "All" : REQ_TYPES[f]}
      </button>`).join("")}
  </div>`;

  const failed = state.error && state.error.includes(cat.label);
  let body;
  if (filtered.length === 0) {
    if (failed) body = `<div class="empty-state">This quest line failed on the last run — check the error up top, then hit Run Quest again.</div>`;
    else if (!state.lastScan) body = `<div class="empty-state"><div class="mascot-empty">${CAT_SVG}</div>Tap <b>Run Quest</b> up top to pull today's loot.</div>`;
    else body = `<div class="empty-state">No results match this filter.</div>`;
  } else {
    body = filtered.map(itemCard).join("");
  }
  return filterBar + `<div class="grid">${body}</div>`;
}

function renderDashboard() {
  const counts = Object.keys(CATEGORIES).filter(k => k !== "dashboard")
    .map(k => ({ label: CATEGORIES[k].icon + " " + CATEGORIES[k].label, count: (state.results[k] || []).length }));
  return `<div class="dashboard-stats">${counts.map(c => `<div class="stat"><div class="num">${c.count}</div><div class="lbl">${c.label}</div></div>`).join("")}
    <div class="stat"><div class="num">${state.saved.size}</div><div class="lbl">💖 Saved</div></div>
  </div>
  ${state.lastScan ? "" : `<div class="empty-state"><div class="mascot-empty">${CAT_SVG}</div>Tap <b>Run Quest</b> up top to start today's live search for your area.</div>`}`;
}

function render() {
  buildNav();
  document.getElementById("lastScanLabel").textContent = state.lastScan ? `last run: ${state.lastScan}` : "no quest run yet";
  const content = document.getElementById("content");
  if (state.tab === "dashboard") content.innerHTML = renderDashboard();
  else content.innerHTML = renderList(state.tab);

  let statusHtml = "";
  if (state.error) statusHtml += `<div class="error-box">${state.error}</div>`;
  document.getElementById("statusArea").innerHTML = statusHtml;
}

// ---------- interactions ----------
function setFilter(key, filter) { state.filters[key] = filter; render(); }

function toggleSave(id) {
  if (state.saved.has(id)) state.saved.delete(id); else state.saved.add(id);
  localStorage.setItem("dff_saved", JSON.stringify([...state.saved]));
  render();
}
function openDirections(query) {
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, "_blank", "noopener");
}
function shareItem(title, url) {
  if (navigator.share) {
    navigator.share({ title, url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => showToast("Link copied"));
  }
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

// ---------- scanning ----------
async function searchCategory(key) {
  const cat = CATEGORIES[key];
  const query = cat.query(state.zip, state.radius);
  const body = { query, max_results: 8, search_depth: cat.searchDepth || "basic" };
  if (cat.timeRange) body.time_range = cat.timeRange;
  if (cat.includeDomains) body.include_domains = cat.includeDomains;

  const response = await fetch("/api/search", {
    method: "POST",
    cache: "no-store",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!response.ok) {
    const errBody = await response.text();
    throw new Error(`${cat.label} search failed (${response.status}). ${errBody.slice(0, 150)}`);
  }
  const data = await response.json();
  return (data.results || []).map(r => toItem(r, key)).filter(Boolean);
}

// ---------- Grocery pricing — fully server-side now. /functions/api/grocery-price.js
// checks Kroger's official price AND a Tavily+OpenRouter web search in parallel,
// then returns whichever is actually cheaper (with its real source labeled).
async function searchGroceryItem(itemName) {
  const params = new URLSearchParams({
    item: itemName,
    zip: state.zip,
    location: state.zip,
    radius: state.radius
  });
  const response = await fetch(`/api/grocery-price?${params}`);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || `Grocery lookup failed (${response.status}) for ${itemName}.`);
  return {
    id: "grocery-" + itemName.replace(/\s+/g, "-").toLowerCase(),
    title: itemName,
    store: data.store || "No price found nearby",
    url: data.url || "#",
    // productUrl -> the actual grocery store's page for the item (used by "Claim").
    // blogUrl -> set only when the winning price came from a third-party page
    // (blog/deal tracker); when present we show a separate "See Blog" link.
    productUrl: data.productUrl || null,
    blogUrl: data.blogUrl || null,
    price: data.price ? `$${data.price.toFixed(2)}` : null,
    isFree: false,
    requirementType: "unknown",
    expires: null,
    category: "grocery"
  };
}
async function searchGroceryCategory() {
  const items = [];
  for (const itemName of GROCERY_ITEMS) {
    try {
      items.push(await searchGroceryItem(itemName));
    } catch (err) {
      state.error = (state.error ? state.error + " " : "") + err.message;
    }
  }
  return items;
}

// Restaurant deals now go through a dedicated endpoint that classifies
// free/BOGO offers server-side (with OpenRouter when configured, regex
// fallback otherwise) — the response is already in final card-ready shape.
async function searchRestaurantCategory() {
  const response = await fetch("/api/restaurant-deals", {
    method: "POST",
    cache: "no-store",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ location: state.zip, radius: state.radius })
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || `Restaurant Deals search failed (${response.status}).`);
  return data.results || [];
}

async function runFullScan() {
  if (state.scanning) return;

  state.scanning = true;
  state.error = null;
  const btn = document.getElementById("refreshBtn");
  const icon = document.getElementById("refreshIcon");
  const label = document.getElementById("refreshLabel");
  btn.disabled = true;
  icon.classList.add("spin");

  const categoryKeys = Object.keys(CATEGORIES).filter(k => k !== "dashboard");
  for (let i = 0; i < categoryKeys.length; i++) {
    const key = categoryKeys[i];
    label.textContent = `Scanning ${CATEGORIES[key].label} (${i + 1}/${categoryKeys.length})`;
    state.results[key] = []; // clear before this category's fetch so failures never show stale data
    try {
      state.results[key] = key === "grocery" ? await searchGroceryCategory()
        : key === "restaurant" ? await searchRestaurantCategory()
        : await searchCategory(key);
    } catch (err) {
      state.error = (state.error ? state.error + " " : "") + err.message;
    }
    render();
  }

  state.lastScan = new Date().toLocaleString([], { hour: "2-digit", minute: "2-digit", month: "short", day: "numeric" });
  localStorage.setItem("dff_last_scan", state.lastScan);
  localStorage.setItem("dff_results", JSON.stringify(state.results));

  state.scanning = false;
  btn.disabled = false;
  icon.classList.remove("spin");
  label.textContent = "run quest";
  render();
}

render();
</script>
</body>
</html>
